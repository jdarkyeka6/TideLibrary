name: TideLibrary to TestFlight Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/testflight-once.yml

permissions:
  contents: read

concurrency:
  group: tidelibrary-testflight
  cancel-in-progress: false

# Trigger 4: persistent incremental index TestFlight build.
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out TideLibrary
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          fi
          xcodebuild -version

      - name: Generate TideLibrary app icon
        run: python3 ios-ci/generate_app_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Install TestFlight lane
        run: |
          mkdir -p fastlane
          cp ios-ci/Gemfile Gemfile
          cp ios-ci/Fastfile fastlane/Fastfile

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build, sign and upload TideLibrary
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane beta

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tidelibrary-ipa
          path: "*.ipa"
          if-no-files-found: warn
